name: CI

# Runs on every pull request into main, and on main itself after a merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: installs exactly what package-lock.json says, nothing newer.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # BKLG-015 (feature 2002): a Playwright step was tried here and pulled
      # back out. See change.md's Notes on the table, V1. playwright.config.ts's
      # baseURL is the real dev domain (https://idelta.com.au); this runner
      # reaches it over the public internet on a home uplink, not the LAN
      # every local run uses, and every login-dependent spec timed out. The
      # real fix is a hermetic runner (its own Postgres, backend and
      # frontend, tests against localhost) -> project/setup/02-repos-and-cicd.md,
      # section "2a. CI -- the gate the rule above depends on".
